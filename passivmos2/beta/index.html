<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PassivMOS — Purchase Tracker (Beta)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', monospace;
      background: #f5f5f5;
      color: #333;
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      border: 2px solid #333;
      padding: 20px;
    }

    h1 { font-size: 22px; font-weight: normal; border-bottom: 2px solid #333; padding-bottom: 6px; margin-bottom: 18px; }
    h2 { font-size: 15px; font-weight: bold; margin-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; }

    .badge {
      display: inline-block;
      background: #333;
      color: #fff;
      font-size: 10px;
      padding: 1px 6px;
      margin-left: 8px;
      vertical-align: middle;
      letter-spacing: 1px;
    }

    .section {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 20px;
    }

    input, select, button {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      border: 1px solid #333;
      padding: 6px 8px;
      background: #fff;
    }

    button {
      cursor: pointer;
      background: #333;
      color: #fff;
      font-weight: bold;
      padding: 6px 14px;
    }

    button:hover { background: #555; }
    button.danger { background: #900; }
    button.danger:hover { background: #c00; }
    button.secondary { background: #fff; color: #333; }
    button.secondary:hover { background: #eee; }

    .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 10px; }
    .field { display: flex; flex-direction: column; gap: 3px; }
    .field label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
    .field input, .field select { width: 100%; }

    .hidden { display: none; }

    /* Sheet table */
    .sheet-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th {
      background: #333;
      color: #fff;
      text-align: left;
      padding: 6px 8px;
      font-weight: normal;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    td {
      padding: 5px 8px;
      border-bottom: 1px solid #eee;
      white-space: nowrap;
    }
    tr:hover td { background: #f9f9f9; }
    .num { text-align: right; }
    .mono { font-family: 'Courier New', monospace; }

    /* Summary row */
    .summary-row td {
      background: #f0f0f0;
      font-weight: bold;
      border-top: 2px solid #333;
      border-bottom: 2px solid #333;
    }

    /* Unrecorded alert */
    .alert {
      background: #fffbe6;
      border: 1px solid #e6c200;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .alert strong { color: #7a5c00; }

    /* P&L color */
    .gain { color: #1a7a1a; }
    .loss { color: #900; }

    /* Token group header */
    .token-header td {
      background: #f5f5f5;
      font-weight: bold;
      font-size: 12px;
      border-top: 2px solid #bbb;
      letter-spacing: 1px;
      padding: 4px 8px;
    }

    /* Add-row (inline input row) */
    .add-row td { background: #fffff0; }
    .add-row input, .add-row select {
      width: 100%;
      border: 1px solid #ccc;
      padding: 4px 6px;
      font-size: 12px;
    }

    .flag-pill {
      display: inline-block;
      background: #e8e8e8;
      border: 1px solid #bbb;
      padding: 1px 7px;
      font-size: 11px;
      border-radius: 2px;
    }

    #status { font-size: 12px; color: #666; margin-top: 6px; min-height: 18px; }
    #login-section { max-width: 400px; }
    #login-section input { width: 100%; margin-bottom: 8px; }
    #login-section button { width: 100%; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .top-bar span { font-size: 12px; color: #666; }
  </style>
</head>
<body>
<div class="container">
  <h1>PassivMOS <span class="badge">BETA</span> — Purchase Tracker</h1>

  <!-- Login -->
  <div id="login-section" class="section">
    <h2>Access</h2>
    <div class="field">
      <label>Your passivmos code</label>
      <input type="password" id="code-input" placeholder="enter your code..." autocomplete="off">
    </div>
    <button onclick="doLogin()">Login</button>
    <div id="status"></div>
  </div>

  <!-- Main app -->
  <div id="app" class="hidden">
    <div class="top-bar">
      <span id="user-label"></span>
      <div style="display:flex;gap:10px;align-items:center">
        <a href="/passivmos2/" style="font-size:12px;color:#333;">← Back to CoinFolio</a>
        <button class="secondary" style="font-size:12px;padding:4px 10px" onclick="doLogout()">Logout</button>
      </div>
    </div>

    <!-- Add purchase form -->
    <div class="section">
      <h2>Add Purchase</h2>
      <div class="row">
        <div class="field" style="flex:0 0 80px">
          <label>Token</label>
          <input type="text" id="f-token" placeholder="ATOM" style="width:80px;text-transform:uppercase">
        </div>
        <div class="field" style="flex:0 0 120px">
          <label>Amount</label>
          <input type="number" id="f-amount" placeholder="10.5" min="0" step="any" style="width:120px">
        </div>
        <div class="field" style="flex:0 0 120px">
          <label>Price (USD)</label>
          <input type="number" id="f-price" placeholder="8.23" min="0" step="any" style="width:120px">
        </div>
        <div class="field" style="flex:0 0 140px">
          <label>Date</label>
          <input type="date" id="f-date" style="width:140px">
        </div>
        <div class="field" style="flex:1;min-width:200px">
          <label>Flag / Source</label>
          <select id="f-flag" style="width:100%"></select>
        </div>
        <div class="field" style="flex:0 0 auto">
          <label>&nbsp;</label>
          <button onclick="addPurchase()">+ Add</button>
        </div>
      </div>
      <div style="margin-top:6px;display:flex;gap:8px;align-items:center">
        <span style="font-size:11px;color:#666">Add custom flag:</span>
        <input type="text" id="custom-flag-input" placeholder="My DCA bot" style="width:180px">
        <button class="secondary" style="font-size:12px;padding:4px 10px" onclick="addCustomFlag()">Save flag</button>
      </div>
      <div id="add-status" style="font-size:12px;color:#666;margin-top:6px"></div>
    </div>

    <!-- Purchases sheet -->
    <div class="section">
      <h2>Purchase History</h2>
      <div id="unrecorded-alerts"></div>
      <div class="sheet-wrap">
        <table id="sheet">
          <thead>
            <tr>
              <th>Token</th>
              <th>Date</th>
              <th class="num">Amount</th>
              <th class="num">Price (USD)</th>
              <th class="num">Total Cost</th>
              <th>Flag</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="sheet-body">
            <tr><td colspan="7" style="color:#999;padding:20px;text-align:center">No purchases recorded yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Per-token summary -->
    <div class="section" id="summary-section" class="hidden">
      <h2>Cost Basis Summary</h2>
      <div class="sheet-wrap">
        <table id="summary-table">
          <thead>
            <tr>
              <th>Token</th>
              <th class="num">Total Bought</th>
              <th class="num">Avg Buy Price</th>
              <th class="num">Total Cost</th>
              <th class="num">Current Price</th>
              <th class="num">P&amp;L</th>
              <th class="num">Unrecorded On-chain</th>
            </tr>
          </thead>
          <tbody id="summary-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let userCode = '';
let allFlags = [];
let currentPrices = {};

// ── Helpers ────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const fmt = (n, d=4) => n == null ? '—' : Number(n).toFixed(d);
const fmtUSD = n => n == null ? '—' : '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const setStatus = (el, msg, err=false) => { $(el).textContent = msg; $(el).style.color = err ? '#900' : '#666'; };

async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok) {
    const e = await r.json().catch(() => ({detail: r.statusText}));
    throw new Error(e.detail || r.statusText);
  }
  return r.json();
}

// ── Auth ───────────────────────────────────────────────────────────────────────
async function doLogin() {
  const code = $('code-input').value.trim();
  if (!code) return setStatus('status', 'Enter your code', true);
  setStatus('status', 'Logging in…');
  try {
    await api('POST', '/api/register', { code });
    userCode = code;
    $('login-section').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('user-label').textContent = 'Logged in · Purchase Tracker Beta';
    await loadAll();
  } catch (e) {
    setStatus('status', e.message, true);
  }
}

async function doLogout() {
  try { await api('POST', '/api/logout'); } catch (_) {}
  userCode = '';
  $('login-section').classList.remove('hidden');
  $('app').classList.add('hidden');
  $('code-input').value = '';
}

// ── Load ───────────────────────────────────────────────────────────────────────
async function loadAll() {
  // Load current prices for P&L
  try {
    const prices = await api('GET', '/api/coinfolio/prices');
    // prices is {coingecko_id: price} — build symbol map from stats
    currentPrices = prices;
  } catch (_) {}

  // Load token->price from stats endpoint (has symbol)
  try {
    const stats = await api('GET', '/api/stats');
    if (stats && stats.tokens) {
      for (const [sym, d] of Object.entries(stats.tokens)) {
        currentPrices['sym:' + sym.toUpperCase()] = d.price;
      }
    }
  } catch (_) {}

  await loadPurchases();
}

async function loadPurchases() {
  try {
    const data = await api('GET', `/api/purchases/${encodeURIComponent(userCode)}`);
    renderFlags([...data.preset_flags, ...data.custom_flags]);
    renderSheet(data.purchases);
    renderSummary(data.summary);
    renderAlerts(data.summary);
  } catch (e) {
    setStatus('add-status', 'Error loading purchases: ' + e.message, true);
  }
}

// ── Render ─────────────────────────────────────────────────────────────────────
function renderFlags(flags) {
  allFlags = flags;
  const sel = $('f-flag');
  const prev = sel.value;
  sel.innerHTML = flags.map(f => `<option value="${esc(f)}">${esc(f)}</option>`).join('');
  if (prev && flags.includes(prev)) sel.value = prev;
}

function renderSheet(purchases) {
  const tbody = $('sheet-body');
  if (!purchases.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="color:#999;padding:20px;text-align:center">No purchases yet. Add one above.</td></tr>';
    return;
  }

  // Group by token
  const byToken = {};
  for (const p of purchases) {
    if (!byToken[p.token]) byToken[p.token] = [];
    byToken[p.token].push(p);
  }

  let html = '';
  for (const [tok, rows] of Object.entries(byToken).sort()) {
    // Token group header
    html += `<tr class="token-header"><td colspan="7">${esc(tok)}</td></tr>`;
    for (const p of rows.sort((a,b) => a.date.localeCompare(b.date))) {
      const total = p.amount * p.price_usd;
      html += `<tr>
        <td>${esc(p.token)}</td>
        <td>${esc(p.date)}</td>
        <td class="num">${fmt(p.amount, 6)}</td>
        <td class="num">${fmtUSD(p.price_usd)}</td>
        <td class="num">${fmtUSD(total)}</td>
        <td><span class="flag-pill">${esc(p.flag)}</span></td>
        <td><button class="danger" style="font-size:11px;padding:2px 8px"
          onclick="deletePurchase('${p.id}')">×</button></td>
      </tr>`;
    }
  }
  tbody.innerHTML = html;
}

function renderSummary(summary) {
  const tbody = $('summary-body');
  const entries = Object.entries(summary);
  if (!entries.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="color:#999;padding:12px">No data</td></tr>';
    return;
  }

  let html = '';
  for (const [tok, s] of entries.sort()) {
    const currentPrice = currentPrices['sym:' + tok] || 0;
    let plHtml = '—';
    if (currentPrice > 0 && s.avg_price_usd > 0) {
      const pl = ((currentPrice - s.avg_price_usd) / s.avg_price_usd) * 100;
      const cls = pl >= 0 ? 'gain' : 'loss';
      plHtml = `<span class="${cls}">${pl >= 0 ? '+' : ''}${pl.toFixed(1)}%</span>`;
    }
    const unrecHtml = s.unrecorded > 0
      ? `<span style="color:#c80">⚠ ${fmt(s.unrecorded, 4)}</span>`
      : '<span style="color:#999">—</span>';

    html += `<tr>
      <td><strong>${esc(tok)}</strong></td>
      <td class="num">${fmt(s.total_amount, 4)}</td>
      <td class="num">${fmtUSD(s.avg_price_usd)}</td>
      <td class="num">${fmtUSD(s.total_cost_usd)}</td>
      <td class="num">${currentPrice > 0 ? fmtUSD(currentPrice) : '—'}</td>
      <td class="num">${plHtml}</td>
      <td class="num">${unrecHtml}</td>
    </tr>`;
  }
  tbody.innerHTML = html;
  $('summary-section').classList.remove('hidden');
}

function renderAlerts(summary) {
  const box = $('unrecorded-alerts');
  const alerts = Object.entries(summary)
    .filter(([,s]) => s.unrecorded > 0)
    .sort(([a],[b]) => a.localeCompare(b));

  if (!alerts.length) { box.innerHTML = ''; return; }

  box.innerHTML = alerts.map(([tok, s]) =>
    `<div class="alert">
      <strong>⚠ ${esc(tok)}:</strong>
      ${fmt(s.unrecorded, 4)} tokens on-chain not in your purchase history.
      <a href="#" style="color:#7a5c00" onclick="prefillToken('${esc(tok)}');return false">Add purchase ↓</a>
    </div>`
  ).join('');
}

// ── Actions ────────────────────────────────────────────────────────────────────
async function addPurchase() {
  const token = $('f-token').value.trim().toUpperCase();
  const amount = parseFloat($('f-amount').value);
  const price = parseFloat($('f-price').value);
  const date = $('f-date').value;
  const flag = $('f-flag').value;

  if (!token) return setStatus('add-status', 'Token required', true);
  if (!amount || amount <= 0) return setStatus('add-status', 'Amount must be > 0', true);
  if (!price || price <= 0) return setStatus('add-status', 'Price must be > 0', true);
  if (!date) return setStatus('add-status', 'Date required', true);

  setStatus('add-status', 'Saving…');
  try {
    await api('POST', `/api/purchases/${encodeURIComponent(userCode)}`, {
      code: userCode, token, amount, price_usd: price, date, flag
    });
    $('f-token').value = '';
    $('f-amount').value = '';
    $('f-price').value = '';
    setStatus('add-status', 'Saved!');
    await loadPurchases();
  } catch (e) {
    setStatus('add-status', e.message, true);
  }
}

async function deletePurchase(id) {
  if (!confirm('Delete this purchase?')) return;
  try {
    await api('DELETE', `/api/purchases/${encodeURIComponent(userCode)}/${id}`);
    await loadPurchases();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function addCustomFlag() {
  const flag = $('custom-flag-input').value.trim();
  if (!flag) return;
  try {
    await api('POST', `/api/purchases/${encodeURIComponent(userCode)}/flags`, {
      code: userCode, flag
    });
    $('custom-flag-input').value = '';
    await loadPurchases();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

function prefillToken(tok) {
  $('f-token').value = tok;
  $('f-token').focus();
  $('f-token').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// Set today as default date
document.addEventListener('DOMContentLoaded', () => {
  $('f-date').value = new Date().toISOString().slice(0, 10);

  // Login on Enter
  $('code-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
});
</script>
</body>
</html>
