      daily.className=cls;
      daily.innerHTML='<div class="'+labelCls+'">EST. DAILY INCOME</div>'+
        '<div class="'+valCls+' pm-daily"></div>';

      var toggleWrap=document.createElement('div');
      toggleWrap.className=cls;
      toggleWrap.style.marginTop='8px';
      var btn=document.createElement('button');
      btn.className='xp-btn pm-eur-btn';
      btn.style.cssText='font-size:11px;padding:3px 10px;';
      btn.textContent='[ Switch to EUR ]';
      btn.addEventListener('click',function(){
        displayEur=!displayEur;
        btn.textContent=displayEur?'[ Switch to USD ]':'[ Switch to EUR ]';
        updateDisplay();
      });
      toggleWrap.appendChild(btn);

      incomeBlock.after(monthly,daily,toggleWrap);
      updateDisplay();
    }

    function updateDisplay(){
      var m=document.querySelector('.pm-monthly');
      var d=document.querySelector('.pm-daily');
      if(m&&yearlyUsd)m.textContent=fmt(yearlyUsd/12);
      if(d&&yearlyUsd)d.textContent=fmt(yearlyUsd/365);
    }

    new MutationObserver(function(){
      var iv=document.querySelector('.income-val');
      if(iv&&iv.textContent.includes('$')){
        var y=parseUsd(iv.textContent);
        if(y&&y!==yearlyUsd){yearlyUsd=y;updateDisplay();}
      }
      injectRows();
    }).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
  })();
  </script>
  </body>
</html>
